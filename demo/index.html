<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Motion</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">SPATIAL MOTION / PERFORMANCE DEMO</p>
          <h1>可编排的 3D 卡片动效引擎</h1>
        </div>
        <div class="stats"><span id="quality">--</span><span id="fps">-- FPS</span><span id="count">-- ITEMS</span><span id="render-stats">-- CALLS</span><span id="extensions">0 EXT</span><span id="effect">LAYOUT MODE</span><span id="selection">0 SELECTED</span></div>
      </header>
      <section id="stage" aria-label="3D motion stage"><div id="pick-debug" hidden></div></section>
      <button id="layout-lab-toggle" class="lab-toggle" aria-controls="layout-lab" aria-expanded="false">布局参数</button>
      <aside id="layout-lab" class="layout-lab" data-open="false" aria-label="布局参数实验室">
        <div class="lab-heading">
          <div><span>LAYOUT LAB</span><strong>实例生成参数</strong></div>
          <button id="layout-lab-close" aria-label="关闭参数面板">×</button>
        </div>
        <label class="lab-select">布局
          <select id="layout-lab-type" aria-label="布局类型"></select>
        </label>
        <label class="lab-select">预设
          <select id="layout-lab-preset" aria-label="布局预设"></select>
        </label>
        <div id="layout-lab-controls" class="lab-controls"></div>
        <div class="lab-actions">
          <button id="layout-lab-reset">恢复默认</button>
          <button id="layout-lab-copy-json">复制 JSON</button>
          <button id="layout-lab-copy-ts">复制 TypeScript</button>
        </div>
        <label class="lab-transfer">JSON 导入 / 复制结果
          <textarea id="layout-lab-transfer" rows="5" spellcheck="false"></textarea>
        </label>
        <button id="layout-lab-import" class="primary">导入 JSON</button>
        <p id="layout-lab-status" class="lab-status" aria-live="polite">调整参数以实时预览</p>
      </aside>
      <footer>
        <div class="controls">
          <button data-layout="sphere">球体</button>
          <button data-layout="box">立方体</button>
          <button data-layout="cylinder">圆柱</button>
          <button data-layout="grid">平面</button>
          <button data-layout="ring">圆环</button>
          <button data-layout="helix">螺旋</button>
          <button data-layout="cone">圆锥</button>
          <button data-layout="scatter">散开</button>
          <button id="tunnel">时空隧道</button>
          <button id="shooter">线性发射</button>
          <button id="vortex">漩涡吸入</button>
          <button id="burst">径向爆发</button>
          <button id="focus">聚焦 5 个</button>
          <button id="restore">恢复布局</button>
          <button id="add-items">+100</button>
          <button id="remove-items">-100</button>
          <button id="sequence" class="primary">连续演示</button>
          <button id="recipe-sphere">散开→球体</button>
          <button id="recipe-box">立方爆炸</button>
          <button id="recipe-cylinder">圆柱右散</button>
          <button id="recipe-grid">平面解散</button>
          <button id="extension-native">原生 3D 扩展</button>
          <button id="extension-gsap">GSAP 扩展</button>
          <button id="stage-pause">暂停舞台</button>
          <button id="stage-resume">恢复舞台</button>
          <button id="extension-clear">移除扩展</button>
        </div>
        <p>Instanced Geometry · Adaptive Quality · Fixed Pool · 单 Draw Call</p>
        <a class="nav-link" href="/benchmark.html">性能基准</a>
      </footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
