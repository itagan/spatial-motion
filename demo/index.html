<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Motion</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">SPATIAL MOTION / PERFORMANCE DEMO</p>
          <h1>可编排的 3D 卡片动效引擎</h1>
        </div>
        <div class="stats"><span id="quality">--</span><span id="fps">-- FPS</span><span id="count">-- ITEMS</span></div>
      </header>
      <section id="stage" aria-label="3D motion stage"></section>
      <footer>
        <div class="controls">
          <button data-layout="sphere">球体</button>
          <button data-layout="cylinder">圆柱</button>
          <button data-layout="grid">平面</button>
          <button id="tunnel">时空隧道</button>
          <button id="shooter">线性发射</button>
          <button id="sequence" class="primary">连续演示</button>
        </div>
        <p>Instanced Geometry · Adaptive Quality · Fixed Pool · 单 Draw Call</p>
      </footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
