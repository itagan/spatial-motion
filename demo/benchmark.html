<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Motion Performance Benchmark</title>
  </head>
  <body>
    <main class="app benchmark-app">
      <header>
        <div>
          <p class="eyebrow">SPATIAL MOTION / BENCHMARK</p>
          <h1>低配设备性能基准</h1>
        </div>
        <a class="nav-link" href="/">返回动效演示</a>
      </header>

      <section class="benchmark-toolbar" aria-label="Benchmark controls">
        <div class="control-group">
          <strong>实例数</strong>
          <div class="controls" id="item-counts">
            <button data-count="100">100</button>
            <button data-count="500" class="active">500</button>
            <button data-count="1000">1000</button>
            <button data-count="2000">2000</button>
          </div>
        </div>
        <div class="control-group">
          <strong>质量</strong>
          <div class="controls" id="quality-modes">
            <button data-quality="auto" class="active">AUTO</button>
            <button data-quality="high">HIGH</button>
            <button data-quality="medium">MEDIUM</button>
            <button data-quality="low">LOW</button>
          </div>
        </div>
        <div class="control-group">
          <strong>布局</strong>
          <div class="controls" id="benchmark-layouts">
            <button data-benchmark-layout="sphere" class="active">球体</button>
            <button data-benchmark-layout="box">立方体</button>
            <button data-benchmark-layout="cylinder">圆柱</button>
            <button data-benchmark-layout="grid">平面</button>
            <button data-benchmark-layout="ring">圆环</button>
            <button data-benchmark-layout="helix">螺旋</button>
            <button data-benchmark-layout="cone">圆锥</button>
            <button data-benchmark-effect="tunnel">隧道</button>
            <button data-benchmark-effect="tunnel-square">方形隧道</button>
            <button data-benchmark-effect="tunnel-burst">隧道爆发</button>
            <button data-benchmark-effect="tunnel-wave">隧道波浪</button>
            <button data-benchmark-effect="shooter-wave">发射波浪</button>
            <button data-benchmark-effect="vortex">漩涡</button>
            <button data-benchmark-effect="burst">爆发</button>
          </div>
        </div>
        <div class="control-group">
          <strong>外部扩展</strong>
          <div class="controls" id="benchmark-extensions">
            <button data-benchmark-extension="none" class="active">NONE</button>
            <button data-benchmark-extension="native">NATIVE</button>
            <button data-benchmark-extension="gsap">GSAP</button>
            <button data-benchmark-extension="both">BOTH</button>
          </div>
        </div>
      </section>

      <section class="metrics" aria-label="Live performance metrics">
        <article><span>FPS</span><strong id="metric-fps">--</strong></article>
        <article><span>FRAME</span><strong id="metric-frame">-- ms</strong></article>
        <article><span>P95 / P99</span><strong id="metric-percentiles">--</strong></article>
        <article><span>CPU / SUBMIT</span><strong id="metric-cpu">--</strong></article>
        <article><span>EXT / UPDATE</span><strong id="metric-extensions">0 / --</strong></article>
        <article><span>EXT DETAIL</span><strong id="metric-extension-detail">--</strong></article>
        <article><span>ITEMS</span><strong id="metric-items">--</strong></article>
        <article><span>SUBMITTED</span><strong id="metric-submitted">--</strong></article>
        <article><span>VISIBLE</span><strong id="metric-visible">--</strong></article>
        <article><span>EFFECT / ACTIVE</span><strong id="metric-effect">layout / 0</strong></article>
        <article><span>CALLS</span><strong id="metric-calls">--</strong></article>
        <article><span>TRIANGLES</span><strong id="metric-triangles">--</strong></article>
        <article><span>ATLAS</span><strong id="metric-texture">--</strong></article>
        <article><span>ATLAS UPDATES</span><strong id="metric-atlas-updates">--</strong></article>
        <article><span>QUALITY</span><strong id="metric-quality">--</strong></article>
        <article><span>WEBGL</span><strong id="metric-context">READY</strong></article>
      </section>

      <section id="benchmark-stage" aria-label="3D benchmark stage"></section>

      <footer class="benchmark-footer">
        <div class="benchmark-actions">
          <label>采样时长
            <select id="duration">
              <option value="3">3 秒</option>
              <option value="10" selected>10 秒</option>
              <option value="20">20 秒</option>
              <option value="60">60 秒</option>
              <option value="300">5 分钟</option>
              <option value="1800">30 分钟</option>
            </select>
          </label>
          <label>采样场景
            <select id="scenario">
              <option value="steady" selected>稳定运行</option>
              <option value="cold-start">冷启动/完整图集</option>
              <option value="atlas-update">连续局部更新</option>
            </select>
          </label>
          <button id="run-benchmark" class="primary">运行性能采样</button>
          <button id="run-stress">运行切换压力测试</button>
          <button id="export-result" disabled>导出 JSON</button>
          <label class="file-button">导入基线 JSON
            <input id="import-baseline" type="file" accept="application/json,.json">
          </label>
        </div>
        <p id="benchmark-status" aria-live="polite">选择配置后运行采样</p>
      </footer>
      <section class="result-panel" aria-label="Benchmark result">
        <pre id="benchmark-result">尚无采样结果</pre>
      </section>
      <section class="result-panel" aria-label="Benchmark comparison">
        <pre id="benchmark-comparison">尚未导入基线结果</pre>
      </section>
    </main>
    <script type="module" src="/benchmark.ts"></script>
  </body>
</html>
