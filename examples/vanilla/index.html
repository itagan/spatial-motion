<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Motion · Vanilla</title>
  </head>
  <body>
    <main id="app" class="example">
      <header>
        <div><h1>Vanilla 卡片自定义</h1><p>基础绘制、源码配方和卡片比例彼此独立。</p></div>
        <span id="status" class="status">starting</span>
      </header>
      <section id="stage" class="stage" aria-label="Vanilla Spatial Motion stage"></section>
      <footer>
        <div class="controls" aria-label="演示控制">
          <div class="control-group">
            <span class="control-label">布局</span>
            <button data-layout="sphere">球体</button>
            <button data-layout="cylinder">圆柱</button>
          </div>
          <div class="control-group">
            <span class="control-label">内容</span>
            <button data-content="default">基础卡片</button>
            <button data-content="product">产品配方</button>
            <button data-content="profile">人物配方</button>
            <button data-content="metric">指标配方</button>
            <button data-content="canvas">Canvas 绘制</button>
          </div>
          <div class="control-group">
            <span class="control-label">比例</span>
            <button data-aspect="square">1:1</button>
            <button data-aspect="portrait">3:4</button>
            <button data-aspect="landscape">16:9</button>
          </div>
          <div class="control-group">
            <span class="control-label">运行</span>
            <button id="pause">暂停</button>
            <button id="resume">恢复</button>
          </div>
        </div>
        <div class="recipe-meta">
          <p>产品、人物和指标仅为可复制源码配方，不是公共预设 API。</p>
          <details class="recipe-source">
            <summary>查看 ES6 源码</summary>
            <div class="recipe-source-toolbar">
              <span>当前内容写法</span>
              <button id="copy-recipe" type="button">复制源码</button>
            </div>
            <pre><code id="recipe-source"></code></pre>
          </details>
        </div>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
